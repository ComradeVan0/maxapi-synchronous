[project]
name = "maxapi"
version = "1.2.2"
description = "Библиотека для разработки чат-ботов с помощью API мессенджера MAX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Denis", email = "bestloveapples@gmail.com" }]
keywords = ["max", "api", "bot"]
classifiers = [
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31.0,<3",
    "backoff>=1.10.0,<1.11.0",
    "pydantic>=2,<3",
    "puremagic>=1.30,<2",
    "magic-filter>=1.0.12,<2",
]

[project.urls]
Homepage = "https://github.com/love-apples/maxapi"
Documentation = "https://love-apples.github.io/maxapi/"
Repository = "https://github.com/love-apples/maxapi"
Issues = "https://github.com/love-apples/maxapi/issues"
Changelog = "https://github.com/love-apples/maxapi/releases"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: пакет maxapi/ лежит в корне, а не в src/.
module-root = ""
# В wheel уходит только maxapi/; в sdist дополнительно тесты и примеры.
source-include = ["tests/**", "examples/**"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15",
    "mypy>=1.19.1",
    "pre-commit>=4.0",
    "coverage>=7.13",
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.3",
    "pymdown-extensions>=10.21",
    "python-dotenv>=1.2.1",
    "Faker>=40.4.0",
    "responses>=0.25.0",
    "libcst>=1.0,<2",
    "types-requests>=2.33.0.20260712",
]

# Инструменты CI: зафиксированы в uv.lock, обновляются через Dependabot.
ci = [
    "actionlint-py>=1.7",
    "zizmor>=1.0",
    "twine>=6.0",
    "check-wheel-contents>=0.6",
]

[tool.uv]
# Enable uv project management and include `dev` group by default when running/syncing
default-groups = ["dev"]
managed = true

[tool.mypy]
python_version = "3.10"
namespace_packages = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
# Путь к тестам
testpaths = ["tests"]

# Параметры запуска
addopts = "-ra --strict-markers -v -W ignore::pytest.PytestUnraisableExceptionWarning"

# Маркеры
markers = [
    "integration: интеграционные тесты, требующие реальный токен бота",
    "slow: медленные тесты",
]

# Фильтры предупреждений
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]


[tool.coverage.report]
# Порог покрытия unit-тестами.
fail_under = 90

[tool.ruff]
src = ["maxapi", "tests"]
line-length = 79
indent-width = 4
target-version = "py310"


[tool.ruff.lint]
# TODO: добавить BLE N PGH PLR TRY
select = ["ALL"]
ignore = [
    "BLE", # TODO: требует рефакторинга
    "ERA", # TODO: требует рефакторинга
    "N", # TODO: требует рефакторинга
    "PGH", # TODO: требует рефакторинга
    "PLR", # TODO: требует рефакторинга
    "TRY", # TODO: требует рефакторинга
    "RUF006", # TODO: требует рефакторинга
    "A",
    "ARG",
    "ANN",
    "COM812",
    "CPY",
    "D",
    "DTZ",
    "EXE",
    "EM",
    "FIX",
    "PLW1641",
    "TC006",
    "RET",
    "RUF001",
    "RUF002",
    "RUF003",
    "SIM108",
    "SIM118",
    "TD",
    "TID",
]

flake8-type-checking.runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "ARG",
    "E402",
    "PL",
    "S",
    "SLF",
]
"examples/**.py" = [
    "INP001",
    "PTH",
    "ASYNC240",
    "PLC0415",
    "S",
    "T20",
    "FBT",
]
"tools/async_to_sync.py" = [
    "T201", # CLI tool — printing to stdout is intentional
]
"maxapi/methods/send_message.py" = [
    "C90", # TODO: требует рефакторинга
]
"maxapi/methods/edit_message.py" = [
    "C90", # TODO: требует рефакторинга
]
"maxapi/connection/base.py" = [
    "C90", # TODO: требует рефакторинга
]
"maxapi/utils/updates.py" = [
    "C90", # TODO: требует рефакторинга
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
